<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · ' + #{app.name}">Meal Token System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <link rel="manifest" th:href="@{/manifest.webmanifest}">
  <meta name="theme-color" content="#166a46">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meal Tokens">
  <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
  <link rel="icon" type="image/png" th:href="@{/icons/icon-192.png}">
</head>
<body>

<!-- top bar: brand, language selector, logout -->
<nav th:fragment="topbar" class="navbar navbar-expand bg-white border-bottom sticky-top px-3">
  <a class="navbar-brand fw-bold text-brand" th:href="@{/home}">
    <i class="bi bi-qr-code-scan me-1"></i><span th:text="#{app.name}">Meal Token System</span>
  </a>
  <ul class="navbar-nav ms-auto align-items-center gap-2">
    <li class="nav-item dropdown">
      <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" role="button">
        <i class="bi bi-translate"></i> <span th:text="#{nav.language}">Language</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" th:href="@{''(lang=en)}" th:text="#{lang.en}">English</a></li>
        <li><a class="dropdown-item" th:href="@{''(lang=mr)}" th:text="#{lang.mr}">Marathi</a></li>
        <li><a class="dropdown-item" th:href="@{''(lang=hi)}" th:text="#{lang.hi}">Hindi</a></li>
      </ul>
    </li>
    <li class="nav-item" sec:authorize="isAuthenticated()">
      <form th:action="@{/logout}" method="post" class="m-0">
        <button class="btn btn-outline-secondary btn-sm" type="submit">
          <i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Logout</span>
        </button>
      </form>
    </li>
  </ul>
</nav>

<!-- sidebar: one entry for now; later phases extend per role -->
<aside th:fragment="sidebar(active)" class="sidebar d-none d-md-block">
  <a th:href="@{/home}" class="side-link" th:classappend="${active == 'dashboard'} ? 'active'">
    <i class="bi bi-speedometer2"></i> <span th:text="#{nav.dashboard}">Dashboard</span>
  </a>
</aside>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
