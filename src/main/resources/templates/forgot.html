<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{forgot.title})}"></head>
<body class="auth-bg">
<nav th:replace="~{fragments/layout :: topbar}"></nav>
<main class="container py-5" style="max-width: 440px;">
  <div class="card shadow-sm border-0"><div class="card-body p-4">
    <h1 class="h4 mb-3" th:text="#{forgot.title}">Reset password</h1>
    <p class="text-muted" th:text="#{forgot.help}">Enter your email and we will send a reset link if the account exists.</p>
    <form th:action="@{/forgot}" method="post">
      <div class="mb-3"><label for="email" class="form-label" th:text="#{login.email}">Email</label>
        <input type="email" id="email" name="email" class="form-control" required autofocus autocomplete="username" maxlength="190"></div>
      <button type="submit" class="btn btn-brand w-100" th:text="#{forgot.submit}">Send link</button>
    </form>
    <p class="text-center mt-3 mb-0 small"><a class="back-link" th:href="@{/login}"><i class="bi bi-arrow-left"></i><span th:text="#{forgot.back}">Back to sign in</span></a></p>
  </div></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
