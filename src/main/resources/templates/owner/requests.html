<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{nav.requests}, ${section}, ~{::section})}">
<body>
<section>
  <h1 class="h4 mb-3" th:text="#{nav.requests}">Subscription requests</h1>

  <div class="card mb-4">
    <div class="card-header" th:text="#{req.pending}">Pending requests</div>
    <div class="table-responsive"><table class="table align-middle mb-0">
      <thead class="table-light"><tr><th th:text="#{col.customer}">Customer</th><th th:text="#{col.phone}">Phone</th><th th:text="#{col.plan}">Plan</th>
        <th th:text="#{plan.tokens}">Tokens</th><th th:text="#{plan.price}">Price</th><th th:text="#{col.date}">Date</th><th></th></tr></thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(requests)}"><td colspan="7" class="text-center text-muted py-4" th:text="#{table.empty}">Nothing</td></tr>
        <tr th:each="r : ${requests}">
          <td th:text="${r.customer}">C</td><td th:text="${r.phone}">P</td><td th:text="${r.plan}">Plan</td>
          <td th:text="${r.tokens}">30</td><td th:text="${@fmt.money(r.price)}">0</td><td th:text="${r.requested}">D</td>
          <td class="text-nowrap">
            <form class="d-inline" method="post" th:action="@{/owner/requests/{id}/approve(id=${r.id})}">
              <button class="btn btn-sm btn-success" type="submit" th:text="#{action.approve}">Approve</button></form>
            <form class="d-inline" method="post" th:action="@{/owner/requests/{id}/reject(id=${r.id})}" th:attr="data-confirm=#{confirm.reject}">
              <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{action.reject}">Reject</button></form>
          </td>
        </tr>
      </tbody></table></div>
  </div>

  <div class="card">
    <div class="card-header" th:text="#{req.payments}">Awaiting payment confirmation</div>
    <div class="table-responsive"><table class="table align-middle mb-0">
      <thead class="table-light"><tr><th th:text="#{col.customer}">Customer</th><th th:text="#{col.amount}">Amount</th><th th:text="#{col.reference}">Reference</th><th></th></tr></thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(payments)}"><td colspan="4" class="text-center text-muted py-4" th:text="#{table.empty}">Nothing</td></tr>
        <tr th:each="p : ${payments}">
          <td th:text="${p.customer}">C</td><td th:text="${@fmt.money(p.amount)}">0</td><td th:text="${p.reference}">R</td>
          <td>
            <div class="d-flex flex-wrap gap-1">
              <form th:action="@{/owner/payments/{id}/confirm(id=${p.id})}" method="post" class="d-flex gap-1" th:attr="data-confirm=#{confirm.payment}">
                <select class="form-select form-select-sm" name="method" th:attr="aria-label=#{col.method}">
                  <option value="CASH" th:text="#{status.CASH}">Cash</option>
                  <option value="UPI" th:text="#{status.UPI}" th:selected="${p.reference != ''}">UPI</option>
                </select>
                <input class="form-control form-control-sm" name="reference" maxlength="100" th:value="${p.reference}" th:placeholder="#{col.reference}" th:attr="aria-label=#{col.reference}">
                <button class="btn btn-sm btn-success" type="submit" th:text="#{action.confirm}">Confirm</button>
              </form>
              <form th:action="@{/owner/payments/{id}/reject(id=${p.id})}" method="post" th:attr="data-confirm=#{confirm.reject}">
                <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{action.reject}">Reject</button></form>
            </div>
          </td>
        </tr>
      </tbody></table></div>
  </div>
</section>
</body>
</html>
