<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{bill.title}, ${section}, ~{::section})}">
<body>
<section>
  <div class="page-head">
    <h1 class="h4" th:text="#{bill.title}">Billing</h1>
    <div class="actions"><a class="btn btn-outline-secondary btn-sm" th:href="@{/owner/table/payments}"><i class="bi bi-clock-history"></i><span th:text="#{bill.history}">Payment history</span></a></div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3"><div class="card card-body text-center"><small class="text-muted" th:text="#{bill.billed}">Billed</small><strong class="fs-5 money" th:text="${@fmt.money(summary.billed)}">0</strong></div></div>
    <div class="col-6 col-lg-3"><div class="card card-body text-center"><small class="text-muted" th:text="#{bill.collected}">Collected</small><strong class="fs-5 text-success money" th:text="${@fmt.money(summary.collected)}">0</strong></div></div>
    <div class="col-6 col-lg-3"><div class="card card-body text-center"><small class="text-muted" th:text="#{bill.outstanding}">Outstanding</small><strong class="fs-5 text-danger money" th:text="${@fmt.money(summary.outstanding)}">0</strong><small class="text-muted"><span th:text="${summary.openCount}">0</span> <span th:text="#{bill.open}">open</span></small></div></div>
    <div class="col-6 col-lg-3"><div class="card card-body text-center"><small class="text-muted" th:text="#{bill.today}">Collected today</small><strong class="fs-5 money" th:text="${@fmt.money(summary.collectedToday)}">0</strong></div></div>
  </div>

  <p class="text-muted" th:if="${#lists.isEmpty(lines)}" th:text="#{bill.none}">No bills yet.</p>
  <div class="vstack gap-3">
<th:block th:each="l, st : ${lines}">
      <h2 class="h6 m-0 text-danger" th:if="${st.index == 0 and pendingCount > 0}"><i class="bi bi-hourglass-split"></i> <span th:text="#{bill.section.pending}">Pending balance</span></h2>
      <h2 class="h6 m-0 mt-2 text-success" th:if="${st.index == pendingCount and st.index > 0 or (st.index == 0 and pendingCount == 0)}"><i class="bi bi-check2-circle"></i> <span th:text="#{bill.section.settled}">Fully paid</span></h2>
    <div class="card card-body" th:classappend="${!l.settled} ? 'border-danger'">
      <div class="d-flex justify-content-between align-items-start">
        <div><strong th:text="${l.party}">Customer</strong> <small class="text-muted" th:text="${l.phone}"></small><div class="small text-muted" th:text="${l.planName}">Plan</div></div>
        <span th:replace="~{fragments/ui :: badge(${l.status})}"></span>
      </div>
      <div class="progress my-2" style="height:.5rem" role="progressbar"><div class="progress-bar bg-success" th:style="'width:' + ${l.percentPaid} + '%'"></div></div>
      <div class="bill-strip">
        <div><small class="text-muted" th:text="#{bill.total}">Total</small><strong class="money" th:text="${@fmt.money(l.total)}">0</strong></div>
        <div><small class="text-muted" th:text="#{bill.paid}">Paid</small><strong class="text-success money" th:text="${@fmt.money(l.paid)}">0</strong></div>
        <div><small class="text-muted" th:text="#{bill.due}">Remaining</small><strong class="money" th:classappend="${l.settled} ? 'text-success' : 'text-danger'" th:text="${@fmt.money(l.due)}">0</strong></div>
      </div>
      <div class="alert alert-warning small py-2 mb-0 mt-2" th:unless="${l.settled}">
        <i class="bi bi-hourglass-split"></i>
        <span th:text="#{bill.pending.notice(${@fmt.money(l.due)})}">Pending</span>
        <span th:if="${l.heldTokens > 0}" th:text="#{bill.hold.notice(${l.heldTokens})}">Last tokens are on hold until paid.</span>
      </div>
      <div class="alert small py-2 mb-0 mt-2" th:classappend="${l.alertLevel == 2} ? 'alert-danger' : 'alert-warning'" th:if="${l.alertLevel > 0}" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:if="${l.alertLevel == 1}" th:text="#{bill.alert.warn(${l.tokensBeforeHold}, ${@fmt.money(l.due)})}">Settle</span>
        <span th:if="${l.alertLevel == 2}" th:text="#{bill.alert.blocked(${@fmt.money(l.due)})}">Settle</span>
      </div>
      <details class="mt-2" th:if="${ledger.get(l.subscriptionId) != null}">
        <summary class="small text-muted" th:text="#{bill.ledger}">Payment details</summary>
        <ul class="list-group list-group-flush small mt-1">
          <li class="list-group-item d-flex justify-content-between px-0" th:each="e : ${ledger.get(l.subscriptionId)}">
            <span><span th:replace="~{fragments/ui :: badge(${e.status})}"></span>
              <span class="text-muted" th:text="${e.status == 'SUCCESS'} ? (${e.paid_on} + ' · ' + ${e.method} + (${e.reference} != '' ? ' · ' + ${e.reference} : '') + (${e.received_by} != '' ? ' · ' + ${e.received_by} : '')) : #{bill.balance.pending}">when</span></span>
            <strong class="money" th:text="${@fmt.money(e.amount)}">0</strong>
          </li>
        </ul>
      </details>
      <form class="row g-2 mt-2" method="post" th:action="@{/owner/billing/{id}/receive(id=${l.subscriptionId})}" th:unless="${l.settled or l.status == 'CANCELLED'}" data-multi>
        <div class="col-6 col-md-3"><input class="form-control" type="number" name="amount" step="0.01" min="0.01" th:max="${l.due}" th:value="${l.due}" required th:attr="aria-label=#{bill.amount}"></div>
        <div class="col-6 col-md-2"><select class="form-select" name="method"><option value="CASH" th:text="#{bill.cash}">Cash</option><option value="UPI" th:text="#{bill.upi}">UPI</option></select></div>
        <div class="col-12 col-md-3"><input class="form-control" name="reference" maxlength="100" th:placeholder="#{bill.reference}"></div>
        <div class="col-8 col-md-2 d-flex align-items-center" th:if="${l.status == 'PENDING'}"><div class="form-check"><input class="form-check-input" type="checkbox" name="activateNow" value="true" th:id="'an' + ${l.subscriptionId}"><label class="form-check-label small" th:for="'an' + ${l.subscriptionId}" th:text="#{bill.activate}">Activate now</label></div></div>
        <div class="col-4 col-md-2"><button class="btn btn-brand w-100" type="submit"><i class="bi bi-cash-coin"></i><span th:text="#{bill.receive}">Receive</span></button></div>
      </form>
    </div>
    </th:block>
  </div>
  <div class="actions mt-3 no-print"><a class="btn btn-outline-secondary" th:href="@{/owner/dashboard}"><i class="bi bi-arrow-left"></i><span th:text="#{action.back}">Back</span></a></div>
</section>
</body>
</html>
