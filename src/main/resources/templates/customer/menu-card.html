<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="card(groups, suggested)">
  <div class="card card-body mb-3" th:if="${groups != null and !#lists.isEmpty(groups)}">
    <h2 class="h6"><i class="bi bi-journal-richtext me-1"></i><span th:text="#{menu.today}">Menu for today</span></h2>
    <div th:each="g : ${groups}" class="mb-2">
      <div class="fw-semibold small text-muted" th:classappend="${g.slotId != null and g.slotId == suggested} ? 'text-brand'"
           th:text="${g.slotName != null} ? ${g.slotName} : #{menu.allday}">Lunch</div>
      <ul class="list-unstyled m-0">
        <li class="d-flex gap-2 align-items-start py-1" th:each="i : ${g.items}">
          <span class="veg-dot mt-2" th:classappend="${i.veg} ? 'veg' : 'nonveg'"></span>
          <div class="flex-grow-1">
            <span th:text="${i.name}" th:classappend="${!i.available} ? 'text-decoration-line-through text-muted'">Dal</span>
            <div class="small text-muted" th:if="${i.description != null}" th:text="${i.description}">note</div>
          </div>
          <span class="badge text-bg-secondary" th:if="${!i.available}" th:text="#{menu.soldout}">Sold out</span>
        </li>
      </ul>
    </div>
  </div>
</th:block>
</body>
</html>
