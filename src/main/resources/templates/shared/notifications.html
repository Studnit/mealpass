<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{nav.notifications}, ${section}, ~{::section})}">
<body>
<section>
  <div class="page-head">
    <h1 class="h4 m-0" th:text="#{nav.notifications}">Notifications</h1>
    <form method="post" th:action="@{/notifications/read}" data-multi>
      <button class="btn btn-outline-secondary btn-sm" type="submit" th:text="#{notif.markread}">Mark all read</button></form>
  </div>
  <div class="list-group">
    <div th:if="${page.empty}" class="list-group-item text-center text-muted py-5"><i class="bi bi-bell-slash fs-1 d-block"></i><span th:text="#{table.empty}">Nothing</span></div>
    <div class="list-group-item" th:each="n : ${page.content}" th:classappend="${!n.read} ? 'list-group-item-warning'">
      <div th:text="${@notificationText.render(n.message)}">Message</div>
      <small class="text-muted" th:text="${@fmt.dateTime(n.createdAt, 'Asia/Kolkata')}">When</small>
    </div>
  </div>
  <nav class="mt-3" th:if="${page.totalPages > 1}" th:attr="aria-label=#{table.pagination}">
    <ul class="pagination pagination-sm">
      <li class="page-item" th:classappend="${page.first} ? 'disabled'"><a class="page-link" th:href="@{/notifications(page=${page.number - 1})}" th:text="#{table.prev}">Prev</a></li>
      <li class="page-item disabled"><span class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1</span></li>
      <li class="page-item" th:classappend="${page.last} ? 'disabled'"><a class="page-link" th:href="@{/notifications(page=${page.number + 1})}" th:text="#{table.next}">Next</a></li>
    </ul>
  </nav>
</section>
</body>
</html>
