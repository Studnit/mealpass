<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{nav.verify}, ${section}, ~{::section})}">
<body>
<section>
  <h1 class="h4 mb-3" th:text="#{verify.customer}">Customer</h1>
  <div class="card card-body mb-3">
    <h2 class="h5" th:text="${info.name}">Name</h2>
    <p class="text-muted" th:text="${info.phone}">Phone</p>
    <div th:if="${info.status == null}" class="alert alert-danger mb-0" th:text="#{error.sub.none}">No active subscription.</div>
    <dl class="row mb-0" th:if="${info.status != null}">
      <dt class="col-5" th:text="#{col.plan}">Plan</dt><dd class="col-7" th:text="${info.plan}">Plan</dd>
      <dt class="col-5" th:text="#{receipt.remaining}">Remaining</dt><dd class="col-7"><strong class="token-big" th:text="${info.remaining}">0</strong> / <span th:text="${info.total}">30</span></dd>
      <dt class="col-5" th:text="#{col.expiry}">Expiry</dt><dd class="col-7" th:text="${@fmt.date(info.expiry)}">Date</dd>
    </dl>
  </div>

  <form th:if="${info.status != null}" method="post" th:action="@{/{a}/verify/redeem(a=${area})}">
    <input type="hidden" name="key" th:value="${key}">
    <h2 class="h6" th:text="#{redeem.choose}">Choose the meal to serve</h2>
    <div class="slot-grid">
      <button th:each="s : ${slots}" class="btn btn-brand slot-btn" type="submit" name="slotId" th:value="${s.id}"
              th:disabled="${servedSlotIds.contains(s.id)}">
        <span th:text="${s.name}">Lunch</span>
        <small th:if="${servedSlotIds.contains(s.id)}" th:text="'· ' + #{redeem.served}">served</small>
      </button>
    </div>
    <div class="form-actions"><a class="btn btn-outline-secondary" th:href="@{/{a}/verify(a=${area})}"><i class="bi bi-x-lg"></i><span th:text="#{action.cancel}">Cancel</span></a></div>
  </form>
</section>
</body>
</html>
