<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{nav.verify}, ${section}, ~{::section})}">
<body>
<section>
  <h1 class="h4 mb-1" th:text="#{nav.verify}">Verify customer</h1>
  <p class="text-muted" th:text="#{verify.help}">Ask the customer to open My Pass and show the QR code, or look them up manually.</p>

  <div th:if="${receiptRef != null}" class="alert alert-success">
    <i class="bi bi-check-circle me-1"></i><strong th:text="#{verify.done}">Meal recorded</strong>
    <div><span th:text="${receiptMeal}">Lunch</span> · <span th:text="${receiptRef}">REF</span> · <span th:text="#{receipt.remaining}">Remaining</span>: <strong th:text="${receiptRemaining}">0</strong></div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-6">
      <div class="card card-body">
        <h2 class="h6" th:text="#{verify.scan.pass}">Scan customer pass</h2>
        <div id="scanner" data-mode="pass" th:attr="data-msg-scanning=#{scan.scanning},data-msg-denied=#{scan.denied},data-msg-nocamera=#{scan.nocamera},data-msg-invalid=#{scan.invalid},data-msg-insecure=#{scan.insecure},data-msg-photofail=#{scan.photofail}">
          <div class="scanner-box idle" id="scanBox">
            <video id="video" muted playsinline th:attr="aria-label=#{scan.camera}"></video>
            <div class="scanner-idle"><i class="bi bi-qr-code-scan"></i><span th:text="#{scan.idle}">Camera is off</span></div>
          </div>
          <div class="scan-actions">
            <button id="startScan" type="button" class="btn btn-brand full"><i class="bi bi-camera"></i><span th:text="#{scan.start}">Start camera</span></button>
            <button id="stopScan" type="button" class="btn btn-outline-secondary full d-none"><i class="bi bi-x-lg"></i><span th:text="#{scan.stop}">Stop camera</span></button>
            <label class="btn btn-outline-primary full" for="photoInput"><i class="bi bi-image"></i><span th:text="#{scan.photo}">Take a photo of the QR</span></label>
          </div>
          <input id="photoInput" type="file" accept="image/*" capture="environment" class="d-none">
          <div id="scanStatus" class="scan-status" role="status" aria-live="polite"></div>
        </div>
        <form id="passForm" method="post" th:action="@{/{a}/verify/lookup(a=${area})}" data-multi>
          <input type="hidden" id="token" name="token">
        </form>
      </div>
    </div>
    <div class="col-12 col-lg-6">
      <form class="card card-body" method="post" th:action="@{/{a}/verify/lookup(a=${area})}">
        <h2 class="h6" th:text="#{verify.manual}">Manual lookup</h2>
        <label class="form-label" for="identifier" th:text="#{verify.identifier}">Customer email or phone</label>
        <input class="form-control mb-2" id="identifier" name="identifier" required maxlength="190" autocomplete="off">
        <div class="form-text mb-3" th:text="#{verify.manual.help}">Manual lookups are recorded in the audit log.</div>
        <button class="btn btn-outline-primary" type="submit" th:text="#{verify.find}">Find</button>
      </form>
    </div>
  </div>
  <script th:src="@{/js/jsQR.min.js}"></script>
  <script th:src="@{/js/scan.js}"></script>
</section>
</body>
</html>
