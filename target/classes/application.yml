spring:
  application:
    name: meal-token-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres.railway.internal:5432/railway}
    username: ${DB_USERNAME:postgres}
    password: YvYmQcNDeTnIJWjiMZsypddAIcTDDqAc
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # behind an HTTPS reverse proxy, keep the original scheme/host
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  # Public address of the app (e.g. https://meals.example.com), encoded in hotel QR codes and reset links.
  # Only the QR identifier is stored in the database, so changing this value re-points every QR on restart.
  # Leave empty to use the address of the current request.
  public-base-url: ${PUBLIC_BASE_URL:}
  upload-dir: ${UPLOAD_DIR:uploads}
  security:
    # HMAC key for customer pass tokens. MUST be overridden in production (>= 16 chars).
    qr-secret: ${QR_SECRET:dev-only-change-this-secret-before-production}
  # Online payments are disabled unless APP_PAYMENT_WEBHOOK_SECRET is set (see README).
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@mealtoken.local}
    admin-password: ${ADMIN_PASSWORD:ChangeMe#2026}
  seed-demo-data: ${SEED_DEMO_DATA:false}
