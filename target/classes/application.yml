spring:
  application:
    name: meal-token-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres.railway.internal:5432/railway}
    username: ${DB_USERNAME:postgres}
    password: YvYmQcNDeTnIJWjiMZsypddAIcTDDqAc
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
  # Email used to send verification codes. Put the Gmail App Password (not the normal password) below
  # or set the MAIL_APP_PASSWORD environment variable (recommended on Railway). Do not commit a real password to a public repository.
  mail:
    host: smtp.gmail.com
    port: 587
    username: 2020kharose@gmail.com
    password: ${MAIL_APP_PASSWORD:hrif okjy bczn nszd}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # behind an HTTPS reverse proxy, keep the original scheme/host
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  # Public address of the app (e.g. https://meals.example.com), encoded in hotel QR codes and reset links.
  # Only the QR identifier is stored in the database, so changing this value re-points every QR on restart.
  # Leave empty to use the address of the current request.
  public-base-url: ${PUBLIC_BASE_URL:}
  upload-dir: ${UPLOAD_DIR:uploads}
  # Email / mobile verification at sign-up. Email is sent through spring.mail (Gmail, see above);
  # a mobile code is sent when OTP_SMS_WEBHOOK_URL is set (any SMS / WhatsApp gateway that accepts a JSON webhook).
  otp:
    # true: new accounts must verify a code before signing in. false: no verification (accounts are active immediately).
    enabled: ${OTP_ENABLED:true}
    sms-webhook-url: ${OTP_SMS_WEBHOOK_URL:}
    sms-webhook-token: ${OTP_SMS_WEBHOOK_TOKEN:}
  mail:
    from: ${MAIL_FROM:nkharose.dev@gmail.com}
  security:
    # HMAC key for customer pass tokens. MUST be overridden in production (>= 16 chars).
    qr-secret: ${QR_SECRET:dev-only-change-this-secret-before-production}
  # Online payments are disabled unless APP_PAYMENT_WEBHOOK_SECRET is set (see README).
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@mealtoken.local}
    admin-password: ${ADMIN_PASSWORD:ChangeMe#2026}
  seed-demo-data: ${SEED_DEMO_DATA:false}
