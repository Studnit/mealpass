<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Confirm the money actually received: the amount may be less than what is pending (part payment). -->
<form th:fragment="form(p, area)" th:action="@{/{a}/payments/{id}/confirm(a=${area},id=${p.id})}" method="post" class="d-flex flex-wrap gap-1 align-items-center" th:attr="data-confirm=#{confirm.payment}">
  <input class="form-control form-control-sm" style="width:6.5rem" type="number" name="amount" step="0.01" min="0.01" th:max="${p.amount}" th:value="${p.amount}" required
         th:attr="aria-label=#{bill.received},title=#{bill.received}">
  <select class="form-select form-select-sm" style="width:auto" name="method" th:attr="aria-label=#{col.method}">
    <option value="CASH" th:text="#{status.CASH}">Cash</option>
    <option value="UPI" th:text="#{status.UPI}" th:selected="${p.reference != ''}">UPI</option>
  </select>
  <input class="form-control form-control-sm" style="width:8rem" name="reference" maxlength="100" th:value="${p.reference}" th:placeholder="#{col.reference}" th:attr="aria-label=#{col.reference}">
  <div class="form-check m-0" th:if="${p.sub_status == 'PENDING'}">
    <input class="form-check-input" type="checkbox" name="activateNow" value="true" th:id="'act' + ${p.id}">
    <label class="form-check-label small" th:for="'act' + ${p.id}" th:text="#{bill.activate}">Activate now</label>
  </div>
  <button class="btn btn-sm btn-success" type="submit" th:text="#{action.confirm}">Confirm</button>
</form>
</body>
</html>
