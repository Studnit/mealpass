<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{nav.plans}, ${section}, ~{::section})}">
<body>
<section>
  <h1 class="h4 mb-3" th:text="#{nav.plans}">Plans</h1>
  <p class="text-muted" th:text="#{plan.help}">Changing a plan never alters subscriptions that were already activated.</p>
  <div class="row g-3">
    <div class="col-12 col-xl-6" th:each="p : ${plans}">
      <form class="card card-body" method="post" th:action="@{/owner/plans}">
        <input type="hidden" name="planId" th:value="${p.id}">
        <div th:replace="~{owner/plan-fields :: fields(${p}, ${'p' + p.id})}"></div>
        <button class="btn btn-outline-primary mt-3" type="submit" th:text="#{action.save}">Save</button>
      </form>
    </div>
    <div class="col-12 col-xl-6">
      <form class="card card-body border-brand" method="post" th:action="@{/owner/plans}">
        <h2 class="h6" th:text="#{plan.new}">New plan</h2>
        <div th:replace="~{owner/plan-fields :: fields(null, 'new')}"></div>
        <button class="btn btn-brand mt-3" type="submit" th:text="#{action.add}">Add</button>
      </form>
    </div>
  </div>

</section>
</body>
</html>
