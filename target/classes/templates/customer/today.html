<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{nav.today}, ${section}, ~{::section})}">
<body>
<section>
  <h1 class="h4 mb-3" th:text="#{nav.today}">Today's meals</h1>
  <div class="text-center text-muted py-5" th:if="${#lists.isEmpty(subs)}"><i class="bi bi-inbox fs-1 d-block"></i><span th:text="#{customer.nosubs}">None</span></div>
  <div class="row g-3">
    <div class="col-12 col-lg-6" th:each="s : ${subs}"><div th:replace="~{customer/sub-card :: card(${s}, true)}"></div></div>
  </div>
</section>
</body>
</html>
