<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{nav.scan}, ${section}, ~{::section})}">
<body>
<section>
  <div class="mx-auto" style="max-width: 520px;">
    <div class="page-head"><h1 class="h4" th:text="#{nav.scan}">Scan hotel QR</h1></div>
    <p class="text-muted" th:text="#{scan.help}">Point your camera at the QR code displayed at the hotel.</p>
    <div class="card card-body mb-3">
      <div id="scanner" data-mode="hotel" th:attr="data-msg-scanning=#{scan.scanning},data-msg-denied=#{scan.denied},data-msg-nocamera=#{scan.nocamera},data-msg-invalid=#{scan.invalid},data-msg-insecure=#{scan.insecure},data-msg-photofail=#{scan.photofail}">
        <div class="scanner-box idle" id="scanBox">
          <video id="video" muted playsinline th:attr="aria-label=#{scan.camera}"></video>
          <div class="scanner-idle"><i class="bi bi-qr-code-scan"></i><span th:text="#{scan.idle}">Camera is off</span></div>
        </div>
        <div class="scan-actions">
          <button id="startScan" type="button" class="btn btn-brand btn-lg full"><i class="bi bi-camera"></i><span th:text="#{scan.start}">Start camera</span></button>
          <button id="stopScan" type="button" class="btn btn-outline-secondary btn-lg full d-none"><i class="bi bi-x-lg"></i><span th:text="#{scan.stop}">Stop camera</span></button>
          <label class="btn btn-outline-primary full" for="photoInput"><i class="bi bi-image"></i><span th:text="#{scan.photo}">Take a photo of the QR</span></label>
        </div>
        <input id="photoInput" type="file" accept="image/*" capture="environment" class="d-none">
        <div id="scanStatus" class="scan-status" role="status" aria-live="polite"></div>
      </div>
    </div>
    <form id="manualForm" class="card card-body" data-multi>
      <label class="form-label" for="manualCode" th:text="#{scan.manual}">Or paste the link shown under the QR code</label>
      <div class="input-group">
        <input class="form-control" id="manualCode" inputmode="url" autocomplete="off" maxlength="300">
        <button class="btn btn-outline-primary" type="submit" th:text="#{scan.open}">Open</button>
      </div>
    </form>
  </div>
  <script th:src="@{/js/jsQR.min.js}"></script>
  <script th:src="@{/js/scan.js}"></script>
</section>
</body>
</html>
