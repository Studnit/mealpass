<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{nav.pass}, ${section}, ~{::section})}">
<body>
<section>
  <h1 class="h4 mb-1" th:text="#{nav.pass}">My pass</h1>
  <p class="text-muted" th:text="#{pass.help}">Show this code to hotel staff if you cannot scan the hotel QR yourself. It changes every few minutes.</p>
  <div class="card card-body text-center mx-auto" style="max-width: 420px;">
    <img id="passQr" class="qr-img mx-auto" th:src="@{/customer/pass/qr.png}" th:alt="#{pass.alt}" width="320" height="320">
    <small class="text-muted mt-2" th:text="#{pass.refresh}">Refreshes automatically.</small>
  </div>
  <script>
    setInterval(function () {
      var img = document.getElementById('passQr');
      if (img && !document.hidden) img.src = img.src.split('?')[0] + '?t=' + Date.now();
    }, 240000);
  </script>
</section>
</body>
</html>
