<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(${hotel.name}, ${section}, ~{::section})}">
<body>
<section>
  <div class="d-flex align-items-center gap-3 mb-3">
    <span th:replace="~{fragments/ui :: logo(${hotel.id}, ${hotel.logoPath != null}, 64)}"></span>
    <div><h1 class="h4 m-0" th:text="${hotel.name}">Hotel</h1>
      <small class="text-muted d-block" th:text="${hotel.address}">Address</small>
      <small class="text-muted" th:text="${hotel.phone}">Phone</small></div>
  </div>
  <p class="text-muted" th:if="${hotel.operatingHours != null}"><i class="bi bi-clock"></i> <span th:text="${hotel.operatingHours}">hours</span></p>
  <p><span class="badge text-bg-light border me-1" th:each="s : ${slots}"
           th:text="${s.name} + ' ' + ${#temporals.format(s.startTime, 'HH:mm')} + '–' + ${#temporals.format(s.endTime, 'HH:mm')}">Lunch</span></p>

  <div th:replace="~{customer/menu-card :: card(${menu}, null)}"></div>

  <div class="row g-3 mb-4" th:if="${!#lists.isEmpty(mine)}">
    <div class="col-12 col-lg-6" th:each="s : ${mine}" th:if="${s.status == 'ACTIVE' or s.status == 'PENDING'}">
      <div th:replace="~{customer/sub-card :: card(${s}, false)}"></div></div>
  </div>

  <h2 class="h5" th:text="#{nav.subscriptions}">Subscription plans</h2>
  <div class="text-muted" th:if="${#lists.isEmpty(plans)}" th:text="#{hotel.noplans}">No plans available yet.</div>
  <div class="row g-3">
    <div class="col-12 col-md-6" th:each="p : ${plans}">
      <div class="card h-100"><div class="card-body d-flex flex-column">
        <h3 class="h5" th:text="${p.planName}">Plan</h3>
        <div class="display-6 text-brand mb-2" th:text="${@fmt.money(p.price)}">0</div>
        <ul class="list-unstyled small flex-grow-1">
          <li><i class="bi bi-coin me-1"></i><span th:text="#{plan.tokens.n(${p.totalTokens})}">30 tokens</span></li>
          <li><i class="bi bi-egg-fried me-1"></i><span th:text="#{plan.meals.n(${p.mealsPerDay})}">1 meal per day</span></li>
          <li><i class="bi bi-calendar3 me-1"></i><span th:text="#{plan.validity.n(${p.validityDays})}">30 days</span></li>
          <li><i class="bi bi-info-circle me-1"></i><span th:text="${p.tokensExpireWithSubscription} ? #{sub.tokens.expire} : #{sub.tokens.keep}">expire</span></li>
        </ul>
        <form method="post" th:action="@{/customer/hotels/{id}/request(id=${hotel.id})}" th:attr="data-confirm=#{confirm.request}">
          <input type="hidden" name="planId" th:value="${p.id}">
          <button class="btn btn-brand w-100" type="submit" th:text="#{sub.request}">Request</button>
        </form>
      </div></div>
    </div>
  </div>
  <p class="small text-muted mt-3" th:text="#{sub.payment.help}">After the hotel approves your request, pay at the hotel by cash or UPI.</p>
</section>
</body>
</html>
