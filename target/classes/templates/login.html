<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body class="auth-bg">
<nav th:replace="~{fragments/layout :: topbar}"></nav>
<main class="container py-5" style="max-width: 440px;">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h1 class="h4 mb-4" th:text="#{login.title}">Sign in</h1>

      <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}" role="alert"></div>
      <div class="alert alert-warning" th:if="${param.throttled}" th:text="#{login.throttled}" role="alert"></div>
      <div class="alert alert-info" th:if="${param.logout}" th:text="#{login.logout}" role="status"></div>
      <div class="alert alert-success" th:if="${registered}" th:text="#{login.registered}" role="status"></div>
      <div class="alert alert-info" th:if="${resetSent}" th:text="#{forgot.sent}" role="status"></div>
      <div class="alert alert-success" th:if="${resetDone}" th:text="#{reset.done}" role="status"></div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label for="username" class="form-label" th:text="#{login.email}">Email</label>
          <input type="email" id="username" name="username" class="form-control" required autofocus autocomplete="username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label" th:text="#{login.password}">Password</label>
          <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-brand w-100" th:text="#{login.submit}">Sign in</button>
      </form>
      <p class="text-center mt-3 mb-1 small"><a th:href="@{/forgot}" th:text="#{forgot.link}">Forgot password?</a></p>
      <p class="text-center mt-1 mb-0 small">
        <span th:text="#{login.noaccount}">No account?</span>
        <a th:href="@{/register}" th:text="#{register.title}">Create account</a>
      </p>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
