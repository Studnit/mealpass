<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{nav.a_hotels}, ${section}, ~{::section})}">
<body>
<section>
  <h1 class="h4 mb-3" th:text="#{nav.a_hotels}">Hotels</h1>
  <form method="get" th:action="@{/admin/hotels}" class="d-flex gap-2 mb-3" data-multi>
    <select class="form-select w-auto" name="status" th:attr="aria-label=#{table.status}">
      <option value="" th:text="#{table.all}">All</option>
      <option th:each="s : ${statuses}" th:value="${s}" th:text="#{${'status.' + s}}" th:selected="${s == status}">S</option>
    </select>
    <button class="btn btn-outline-secondary" type="submit" th:text="#{table.apply}">Apply</button>
  </form>
  <div class="card mb-4"><div class="table-responsive"><table class="table align-middle mb-0">
    <thead class="table-light"><tr><th th:text="#{hotel.name}">Hotel</th><th th:text="#{admin.owner}">Owner</th><th th:text="#{col.status}">Status</th><th th:text="#{dash.active.subscribers}">Active</th><th th:text="#{col.date}">Created</th><th></th></tr></thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(hotels)}"><td colspan="6" class="text-center text-muted py-4" th:text="#{table.empty}">Nothing</td></tr>
      <tr th:each="h : ${hotels}">
        <td th:text="${h.name}">H</td><td><span th:text="${h.owner}">O</span><br><small class="text-muted" th:text="${h.owner_email}">e</small></td>
        <td><span th:replace="~{fragments/ui :: badge(${h.status})}"></span></td><td th:text="${h.active_subs}">0</td><td th:text="${h.created}">D</td>
        <td class="text-nowrap">
          <form class="d-inline" method="post" th:action="@{/admin/hotels/{id}/status(id=${h.id})}" th:if="${h.status != 'ACTIVE'}">
            <input type="hidden" name="status" value="ACTIVE"><button class="btn btn-sm btn-success" type="submit" th:text="#{action.activate}">Activate</button></form>
          <form class="d-inline" method="post" th:action="@{/admin/hotels/{id}/status(id=${h.id})}" th:if="${h.status == 'ACTIVE'}" th:attr="data-confirm=#{confirm.hotel.suspend}">
            <input type="hidden" name="status" value="SUSPENDED"><button class="btn btn-sm btn-outline-warning" type="submit" th:text="#{action.suspend}">Suspend</button></form>
          <form class="d-inline" method="post" th:action="@{/admin/hotels/{id}/status(id=${h.id})}" th:if="${h.status != 'DEACTIVATED'}" th:attr="data-confirm=#{confirm.hotel.deactivate}">
            <input type="hidden" name="status" value="DEACTIVATED"><button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{action.deactivate}">Deactivate</button></form>
        </td>
      </tr>
    </tbody></table></div></div>

  <form class="card card-body" method="post" th:action="@{/admin/hotels}">
    <h2 class="h6" th:text="#{admin.hotel.new}">Register a hotel with its owner account</h2>
    <div class="row g-2">
      <div class="col-md-6"><label class="form-label" for="hn" th:text="#{hotel.name}">Hotel name</label><input class="form-control" id="hn" name="hotelName" required maxlength="150"></div>
      <div class="col-md-6"><label class="form-label" for="on" th:text="#{register.fullName}">Owner name</label><input class="form-control" id="on" name="fullName" required maxlength="150"></div>
      <div class="col-md-6"><label class="form-label" for="hc" th:text="#{hotel.city}">City</label><input class="form-control" id="hc" name="city" maxlength="80"></div>
      <div class="col-md-6"><label class="form-label" for="ha" th:text="#{hotel.area}">Area</label><input class="form-control" id="ha" name="area" maxlength="80"></div>
      <div class="col-md-4"><label class="form-label" for="oe" th:text="#{login.email}">Email</label><input class="form-control" type="email" id="oe" name="email" required maxlength="190"></div>
      <div class="col-md-4"><label class="form-label" for="op" th:text="#{register.phone}">Phone</label><input class="form-control" id="op" name="phone" type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" required></div>
      <div class="col-md-4"><label class="form-label" for="opw" th:text="#{login.password}">Password</label><input class="form-control" type="password" id="opw" name="password" required minlength="8" maxlength="72" autocomplete="new-password"></div>
    </div>
    <button class="btn btn-brand mt-3 align-self-start" type="submit" th:text="#{action.add}">Add</button>
  </form>
</section>
</body>
</html>
