<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{error.page.title})}"></head>
<body class="auth-bg">
<nav th:replace="~{fragments/layout :: topbar}"></nav>
<main class="container py-5 text-center" style="max-width: 560px;">
  <i class="bi bi-exclamation-octagon display-3 text-brand"></i>
  <h1 class="h3 mt-3" th:text="${status == 403} ? #{error.page.forbidden} : (${status == 404} ? #{error.page.notfound} : #{error.page.title})">Something went wrong</h1>
  <p class="text-muted" th:text="#{error.page.help}">Please go back and try again.</p>
  <a class="btn btn-brand" th:href="@{/home}" th:text="#{nav.dashboard}">Home</a>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
