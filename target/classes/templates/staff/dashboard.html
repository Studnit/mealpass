<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/page :: page(#{dash.staff.title}, ${section}, ~{::section})}">
<body>
<section>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h4 m-0" th:text="${hotel.name}">Hotel</h1>
    <a class="btn btn-brand btn-lg" th:href="@{/staff/verify}"><i class="bi bi-person-check"></i> <span th:text="#{nav.verify}">Verify</span></a>
  </div>
  <div th:if="${hotel.status != 'ACTIVE'}" class="alert alert-warning" th:text="#{owner.pending}">Not active.</div>
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3"><div th:replace="~{fragments/ui :: stat(#{dash.today.total}, ${todayTotal}, 'egg-fried')}"></div></div>
    <div class="col-6 col-lg-3" th:each="s : ${todaySlots}"><div th:replace="~{fragments/ui :: stat(${s.name}, ${s.n}, 'cup-hot')}"></div></div>
  </div>

  <div class="card mb-4" th:if="${canConfirm}">
    <div class="card-header" th:text="#{req.payments}">Awaiting payment confirmation</div>
    <div class="table-responsive"><table class="table align-middle mb-0">
      <thead class="table-light"><tr><th th:text="#{col.customer}">Customer</th><th th:text="#{col.amount}">Amount</th><th></th></tr></thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(pendingPayments)}"><td colspan="3" class="text-center text-muted py-4" th:text="#{table.empty}">Nothing</td></tr>
        <tr th:each="p : ${pendingPayments}">
          <td th:text="${p.customer}">C</td><td th:text="${@fmt.money(p.amount)}">0</td>
          <td><div class="d-flex flex-wrap gap-1">
            <form th:action="@{/staff/payments/{id}/confirm(id=${p.id})}" method="post" class="d-flex gap-1" th:attr="data-confirm=#{confirm.payment}">
              <select class="form-select form-select-sm" name="method" th:attr="aria-label=#{col.method}">
                <option value="CASH" th:text="#{status.CASH}">Cash</option><option value="UPI" th:text="#{status.UPI}" th:selected="${p.reference != ''}">UPI</option></select>
              <input class="form-control form-control-sm" name="reference" maxlength="100" th:value="${p.reference}" th:placeholder="#{col.reference}" th:attr="aria-label=#{col.reference}">
              <button class="btn btn-sm btn-success" type="submit" th:text="#{action.confirm}">Confirm</button></form>
            <form th:action="@{/staff/payments/{id}/reject(id=${p.id})}" method="post" th:attr="data-confirm=#{confirm.reject}">
              <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{action.reject}">Reject</button></form>
          </div></td>
        </tr>
      </tbody></table></div>
  </div>

  <div class="card">
    <div class="card-header" th:text="#{dash.recent}">Recent attendance</div>
    <div class="table-responsive"><table class="table mb-0 align-middle">
      <thead class="table-light"><tr><th th:text="#{col.customer}">Customer</th><th th:text="#{col.meal}">Meal</th><th th:text="#{col.time}">Time</th><th th:text="#{col.status}">Status</th></tr></thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(recent)}"><td colspan="4" class="text-center text-muted py-4" th:text="#{table.empty}">Nothing</td></tr>
        <tr th:each="r : ${recent}"><td th:text="${r.customer}">C</td><td th:text="${r.meal}">M</td><td th:text="${r.time_at}">T</td>
          <td><span th:replace="~{fragments/ui :: badge(${r.status})}"></span></td></tr>
      </tbody></table></div>
  </div>
</section>
</body>
</html>
