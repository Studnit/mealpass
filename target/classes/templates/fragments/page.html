<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, active, content)" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · ' + #{app.name}">Meal Token System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <link rel="manifest" th:href="@{/manifest.webmanifest}">
  <meta name="theme-color" content="#166a46">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meal Tokens">
  <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
  <link rel="icon" type="image/png" th:href="@{/icons/icon-192.png}">
</head>
<body>

<a class="visually-hidden-focusable" href="#main-content" th:text="#{a11y.skip}">Skip to content</a>

<nav class="navbar app-topbar bg-white border-bottom sticky-top px-3">
  <button class="btn btn-outline-secondary d-md-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#navDrawer"
          th:attr="aria-label=#{nav.menu}"><i class="bi bi-list"></i></button>
  <a class="navbar-brand app-brand fw-bold text-brand me-auto" th:href="@{/home}">
    <i class="bi bi-qr-code-scan me-1"></i><span th:text="#{app.name}">Meal Token System</span>
  </a>
  <ul class="navbar-nav app-actions flex-row align-items-center gap-2 ms-auto flex-shrink-0">
    <li class="nav-item">
      <button id="installApp" type="button" class="btn btn-brand btn-sm d-none" th:attr="data-ios-hint=#{install.ios}"><i class="bi bi-download"></i> <span th:text="#{install.button}">Install app</span></button>
    </li>
    <li class="nav-item">
      <a class="btn btn-outline-secondary btn-sm position-relative" th:href="@{/notifications}" th:attr="aria-label=#{nav.notifications}">
        <i class="bi bi-bell"></i>
        <span th:if="${unread != null and unread > 0}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              th:text="${unread}">3</span>
      </a>
    </li>
    <li class="nav-item dropdown">
      <a class="btn btn-outline-secondary btn-sm dropdown-toggle" href="#" data-bs-toggle="dropdown" role="button">
        <i class="bi bi-translate"></i> <span class="d-none d-sm-inline" th:text="#{nav.language}">Language</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" th:href="@{''(lang=en)}" th:text="#{lang.en}">English</a></li>
        <li><a class="dropdown-item" th:href="@{''(lang=mr)}" th:text="#{lang.mr}">Marathi</a></li>
        <li><a class="dropdown-item" th:href="@{''(lang=hi)}" th:text="#{lang.hi}">Hindi</a></li>
      </ul>
    </li>
    <li class="nav-item dropdown" th:if="${me != null}">
      <a class="btn btn-outline-secondary btn-sm dropdown-toggle" href="#" data-bs-toggle="dropdown" role="button">
        <i class="bi bi-person-circle"></i> <span class="d-none d-sm-inline" th:text="${me.fullName}">Name</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end">
        <li sec:authorize="hasRole('CUSTOMER')"><a class="dropdown-item" th:href="@{/customer/profile}" th:text="#{nav.profile}">Profile</a></li>
        <li>
          <form th:action="@{/logout}" method="post" class="m-0">
            <button class="dropdown-item" type="submit"><i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Logout</span></button>
          </form>
        </li>
      </ul>
    </li>
  </ul>
</nav>

<!-- mobile drawer -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="navDrawer">
  <div class="offcanvas-header">
    <h2 class="offcanvas-title h5" th:text="#{app.name}">Menu</h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" th:attr="aria-label=#{nav.close}"></button>
  </div>
  <div class="offcanvas-body"><nav th:replace="~{fragments/nav :: navlinks(${active})}"></nav></div>
</div>

<div class="app-shell">
  <aside class="sidebar d-none d-md-block"><nav th:replace="~{fragments/nav :: navlinks(${active})}"></nav></aside>
  <main id="main-content" class="content p-3 p-md-4">
    <div th:if="${ok != null}" class="alert alert-success alert-dismissible fade show" role="status">
      <i class="bi bi-check-circle me-1"></i><span th:text="#{${ok}}">Saved</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" th:attr="aria-label=#{nav.close}"></button>
    </div>
    <div th:if="${err != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle me-1"></i><span th:text="#{${err}}">Error</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" th:attr="aria-label=#{nav.close}"></button>
    </div>
    <div class="page-bar" data-page-bar>
      <button type="button" class="btn-back" data-back th:attr="data-fallback=@{/home}" hidden>
        <i class="bi bi-arrow-left" aria-hidden="true"></i><span th:text="#{action.back}">Back</span>
      </button>
    </div>
    <div th:replace="${content}">page content</div>
  </main>
</div>

<a sec:authorize="hasRole('CUSTOMER')" class="scan-fab" th:href="@{/customer/scan}" th:attr="aria-label=#{nav.scan}">
  <i class="bi bi-qr-code-scan"></i><span th:text="#{tab.scan}">Scan</span>
</a>

<nav sec:authorize="hasRole('CUSTOMER')" class="bottom-nav" th:attr="aria-label=#{nav.menu}">
  <a th:href="@{/customer/dashboard}" th:classappend="${active == 'dashboard'} ? 'on'"><i class="bi bi-house"></i><span th:text="#{tab.home}">Home</span></a>
  <a th:href="@{/customer/subscriptions}" th:classappend="${active == 'subscriptions' or active == 'hotels'} ? 'on'"><i class="bi bi-card-checklist"></i><span th:text="#{tab.plans}">Plans</span></a>
  <a class="scan-tab" th:href="@{/customer/scan}" th:classappend="${active == 'scan'} ? 'on'"><i class="bi bi-qr-code-scan"></i><span th:text="#{tab.scan}">Scan</span></a>
  <a th:href="@{/customer/today}" th:classappend="${active == 'today'} ? 'on'"><i class="bi bi-egg-fried"></i><span th:text="#{tab.meals}">Meals</span></a>
  <button type="button" data-bs-toggle="offcanvas" data-bs-target="#navDrawer"><i class="bi bi-grid"></i><span th:text="#{tab.more}">More</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>

</html>
