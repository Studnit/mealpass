services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mealtoken
      POSTGRES_USER: mealtoken
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mealtoken}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealtoken"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/mealtoken
      DB_USERNAME: mealtoken
      DB_PASSWORD: ${DB_PASSWORD:-mealtoken}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mealtoken.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe#2026}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      OTP_REQUIRED: ${OTP_REQUIRED:-true}
      # To send codes by email / SMS add (see .env.example): SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
      # SPRING_MAIL_PASSWORD, MAIL_FROM, OTP_SMS_WEBHOOK_URL, OTP_SMS_WEBHOOK_TOKEN
      QR_SECRET: ${QR_SECRET:-dev-only-change-this-secret-before-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      APP_PAYMENT_WEBHOOK_SECRET: ${APP_PAYMENT_WEBHOOK_SECRET:-}
    volumes: [uploads:/app/uploads]
    ports: ["8080:8080"]
  # Optional HTTPS front door (needed for the phone camera and for installing the app):
  #   DOMAIN=meals.example.com docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    depends_on: [app]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:8080
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data]
volumes:
  caddy_data:
  pgdata:
  uploads:
